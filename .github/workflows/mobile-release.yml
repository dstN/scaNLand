name: Mobile - Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Build mobile app
        run: npm run build --workspace=apps/mobile

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-web-build
          path: apps/mobile/dist

  build-android:
    needs: build-web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Build shared + mobile
        run: |
          npm run build --workspace=packages/shared
          npm run build --workspace=apps/mobile

      - name: Sync Capacitor
        run: |
          cd apps/mobile
          npx cap sync android

      - name: Build APK
        run: |
          cd apps/mobile/android
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk

  build-ios:
    needs: build-web
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared + mobile
        run: |
          npm run build --workspace=packages/shared
          npm run build --workspace=apps/mobile

      - name: Sync Capacitor
        run: |
          cd apps/mobile
          npx cap sync ios

      - name: Build iOS (archive)
        run: |
          cd apps/mobile/ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
